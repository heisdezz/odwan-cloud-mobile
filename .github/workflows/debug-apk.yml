name: Android debug APK

# Manual builds avoid consuming EAS quota on every source push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  # An EAS cloud build outlives a cancelled GitHub job; do not orphan it.
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - name: Check Expo configuration
        shell: bash
        run: |
          if [[ -z "$EXPO_TOKEN" || -z "$EXPO_PROJECT_ID" ]]; then
            echo '::error::Set the EXPO_TOKEN repository secret and EXPO_PROJECT_ID repository variable before running this workflow.'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.4.0-
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check app
        run: |
          bun run lint
          bun run typecheck
          bun test tests
      - name: Build ARM64 debug APK on EAS
        run: bunx eas-cli build --platform android --profile debug --non-interactive --wait --json > build-result.json
      - name: Download APK
        run: bun scripts/download-debug-apk.js build-result.json artifacts/odwan-debug-arm64.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: odwan-debug-arm64-${{ github.run_number }}
          path: artifacts/odwan-debug-arm64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
